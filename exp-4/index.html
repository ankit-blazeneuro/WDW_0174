<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>

<body>
    <h1>Booking Form</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>
        <label for="phone-Number">Phone Number:</label>
        <input type="number" id="phone-Number" placeholder="Enter your phone number">
        <br><br>
        <label for="checkin-date">Check-in Date:</label>
        <input type="date" id="checkin-date" placeholder="Enter your check-in date">
        <br><br>
        <label for="checkout-date">Check-out Date:</label>
        <input type="date" id="checkout-date" placeholder="Enter your check-out date">
        <br><br>
        <select id="room" required>
            <option value="">Select Room Type</option>
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
        </select>
        <br><br>
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" min="1" max="10" placeholder="Enter number of guests">
        <br><br>
        <label for="extra-message">Extra Message:</label>
        <br>
        <textarea id="extra-message" placeholder="Enter any extra message" rows="4" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit Now">
        <input type="reset" value="Reset Now">
    </form>
</body>

</html>
