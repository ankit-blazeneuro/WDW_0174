<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <form action="">

        <body>
            <h1 align="center">Student Registration Form</h1>
            <hr>
            <p>
    
                

        <label for="full name">Full Name: </label>
        <input type="text" name="full name" id="full name" placeholder="Enter Your Full Name">
        
    </p>
    
    <p>
        
        <label for="Password">Password: </label>
        <input type="password" name="Password" id="Password" placeholder="Enter your Password">
    </p>
    <p>
        
        <label for="Email">Email: </label>
        <input type="email" name="Email" id="Email" placeholder="Enter Your Email">
        <br><br>
        <label for="Password">Password: </label>
        <input type="text" name="Password" id="Password" placeholder="Enter Password">
    </p>
    <label for="gender">Gender: </label>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="male">Female</label>

    <input type="radio" id="Other" name="gender" value="Other" required>
    <label for="Other">Other</label>
<p>
    
    <label for="course">course: </label>
    <select type="course" id="course">
        <option value="BTECHc">BTECH</option>
        <option value="MBA">MBA</option>
        <option value="MCA">MCA</option>
    </select>
</p>
<p>
    
    <label for="contact">contact no. : </label>
    <input type="text" name="contact" id="contact" placeholder="Enter your contact no.">
</p>    
<p>
    
    <label>Address: </label>
    <br>
    <textarea name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea> 
    
</p>
<p>
    <input type="submit" value="Register">     
     <input type="reset" value="Clear">        
     
</p> 

</form>
<hr>
  <p align="center">&copy; 2025 Student Registration Portal</p> 
</body>
</html>
